name: Build unsigned iOS IPA and create Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Optional app version, for example 1.0.1"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build unsigned iOS IPA
    runs-on: macos-15
    timeout-minutes: 35
    env:
      COCOAPODS_DISABLE_STATS: "true"
      APP_NAME: "DEPI Workspace"
      APP_SLUG: "depi-app"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          xcodebuild -version

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Verify Dart code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Calculate version
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          if [[ -z "$VERSION" ]]; then
            VERSION="$(awk '/^version:/ {print $2; exit}' pubspec.yaml | cut -d+ -f1)"
          fi

          if [[ -z "$VERSION" ]]; then
            echo "::error::Could not determine the app version."
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$APP_SLUG-ios-unsigned-v$VERSION-build-$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Build iOS app without signing
        run: |
          flutter build ios --release --no-codesign --build-name="$VERSION" --build-number="$BUILD_NUMBER"

      - name: Package and verify IPA
        shell: bash
        run: |
          set -euo pipefail

          app_path="$(find "$GITHUB_WORKSPACE/build/ios/iphoneos" -maxdepth 1 -type d -name 'Runner.app' -print -quit)"

          if [[ -z "$app_path" ]]; then
            echo "::error::Runner.app was not produced by the iOS build."
            find "$GITHUB_WORKSPACE/build/ios" -maxdepth 4 -print
            exit 1
          fi

          staging_dir="$RUNNER_TEMP/$APP_SLUG-ipa"
          rm -rf "$staging_dir"
          mkdir -p "$staging_dir/Payload"
          cp -R "$app_path" "$staging_dir/Payload/Runner.app"

          ipa_path="$GITHUB_WORKSPACE/build/ios/$APP_SLUG-ios-unsigned-$VERSION-$BUILD_NUMBER.ipa"
          ditto -c -k --sequesterRsrc --keepParent "$staging_dir/Payload" "$ipa_path"

          unzip -t "$ipa_path"
          unzip -l "$ipa_path" | grep -q 'Payload/Runner.app/Info.plist'
          shasum -a 256 "$ipa_path" > "$ipa_path.sha256"

          echo "IPA_PATH=$ipa_path" >> "$GITHUB_ENV"
          echo "SHA_PATH=$ipa_path.sha256" >> "$GITHUB_ENV"
          ls -lh "$ipa_path" "$ipa_path.sha256"

      - name: Create GitHub Release and upload IPA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" "$IPA_PATH" "$SHA_PATH" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$APP_NAME iOS unsigned $VERSION ($BUILD_NUMBER)" --notes "Unsigned IPA for $APP_NAME. It is downloadable for inspection, but it cannot be installed on a physical iPhone until it is signed with an Apple certificate and a provisioning profile."

      - name: Upload IPA as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_SLUG }}-ios-unsigned-${{ env.VERSION }}-${{ env.BUILD_NUMBER }}
          path: |
            ${{ env.IPA_PATH }}
            ${{ env.SHA_PATH }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

